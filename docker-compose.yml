version: "3.8"
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_BACKEND=supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - FLASK_ENV=production
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
